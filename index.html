<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Калории">
<title>AI Calorie Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header>
    <div><small id="date"></small><h1>Сегодня</h1></div>
    <div class="hb"><button class="rb" data-act="theme" id="themebtn" aria-label="Сменить тему"></button><button class="rb" data-act="settings" id="setbtn" aria-label="Настройки"></button></div>
  </header>
  <nav class="seg"><button data-act="tab" data-t="home" class="on">Обзор</button><button data-act="tab" data-t="diary">Дневник</button></nav>
  <section id="view"></section>
</main>
<div class="fab"><button class="btn pri wide" data-act="scan" id="fabbtn"></button></div>
<div id="scan" hidden><video id="vid" playsinline muted autoplay></video><img id="shot" alt="" hidden><div id="ui"></div></div>
<div id="sheet" hidden><div id="sheetbody"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
